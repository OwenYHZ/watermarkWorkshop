<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Owenの中古水印工坊 · 本地 EXIF 查看与水印生成</title>
  <meta name="description" content="本地离线运行：拖入 JPG/PNG，查看完整 EXIF，实时生成带品牌徽标的水印图片并下载。图片不会离开你的电脑。">
  <script>
    (function () {
      try {
        var raw = localStorage.getItem('wm.theme.v1');
        var mode = 'light';
        try { mode = JSON.parse(raw) || 'light'; } catch (e2) { mode = raw || 'light'; }
        var dark = mode === 'dark' ||
          (mode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      } catch (e) {
        document.documentElement.dataset.theme = 'light';
      }
    })();
  </script>
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <div id="photo-backdrop" class="photo-backdrop" aria-hidden="true"></div>
  <header class="topbar">
    <div class="brand">
      <span class="brand-glyph" aria-hidden="true">◈</span>
      <div class="brand-text">
        <strong>Owenの中古水印工坊</strong>
        <span class="brand-sub">本地运行 · 图片不出本机</span>
      </div>
    </div>
    <div class="top-actions">
      <button type="button" id="btn-open" class="btn btn-primary">选择图片</button>
      <button type="button" id="btn-demo" class="btn btn-ghost" hidden>载入示例</button>
      <button type="button" id="btn-help" class="icon-btn" title="快捷键与说明" aria-label="快捷键与说明">?</button>
      <div id="theme-switch" class="theme-switch" role="group" aria-label="界面明暗主题">
        <button type="button" data-theme-mode="dark" title="黑暗" aria-label="黑暗" aria-pressed="false">☾</button>
        <button type="button" data-theme-mode="light" title="开灯" aria-label="开灯" aria-pressed="false">☀</button>
        <button type="button" data-theme-mode="system" title="跟随系统" aria-label="跟随系统" aria-pressed="false">◐</button>
      </div>
    </div>
  </header>

  <main class="workspace">
    <aside class="panel panel-left" aria-label="EXIF 信息">
      <section id="panel-exif" class="tab-panel" aria-label="EXIF 信息">
        <div class="exif-toolbar">
          <input type="search" id="exif-search" class="input search" placeholder="搜索字段 / 值 / 标签…" autocomplete="off">
          <button type="button" id="btn-exif-all" class="btn btn-mini" title="切换字段显示范围" aria-pressed="false">显示全部</button>
          <button type="button" id="btn-reset-exif" class="btn btn-mini" title="撤销当前图片的 EXIF 修改" disabled>复位</button>
          <button type="button" id="btn-json-exif" class="btn btn-mini" title="导出元数据 JSON">JSON</button>
        </div>
        <div class="exif-hint">双击值可修改（只影响界面与水印，不改写原图/导出元数据）；默认只显示常用字段</div>
        <div id="exif-body" class="exif-body">
          <div class="placeholder">载入图片后在这里查看完整 EXIF、XMP、IPTC、ICC 与 PNG 文本块。</div>
        </div>
      </section>
    </aside>

    <div class="resize-handle" data-resize="left" role="separator" aria-orientation="vertical"
         aria-label="调整左侧栏宽度" tabindex="0"></div>

    <div class="center-col">
      <section class="panel-center" aria-label="预览">
        <div class="sr-only">
          <span id="preview-template"></span>
          <span id="preview-brand"></span>
          <span id="preview-status" aria-live="polite"></span>
          <span id="preview-dims"></span>
          <span id="preview-note">实时预览按比例缩放，导出为原始分辨率</span>
          <button type="button" id="btn-compare" tabindex="-1">对比原图</button>
        </div>
        <div id="stage" class="stage">
          <button type="button" id="empty-state" class="empty-state">
            <span class="empty-icon" aria-hidden="true">◫</span>
            <strong class="empty-title">拖入一张照片</strong>
            <span class="empty-line">点击选择，或 Ctrl+V 粘贴</span>
            <span class="empty-line">支持 JPG / PNG，读取完整 EXIF、XMP、IPTC、GPS 与 ICC。</span>
            <span class="empty-note">所有处理都在本机浏览器内完成，不会上传。</span>
          </button>
          <canvas id="preview" class="preview-canvas" hidden></canvas>
        </div>
      </section>

      <section class="bottom-dock" aria-label="图片列表与导出">
        <div class="dock-card dock-gallery">
          <div class="dock-card-head">
            <strong>图片列表</strong>
            <span id="file-count" class="dock-count">0</span>
            <span id="export-format" class="dock-card-note"></span>
            <div class="dock-actions" role="group" aria-label="导出">
              <button type="button" id="btn-export" class="btn btn-mini btn-primary">导出当前图片</button>
              <button type="button" id="btn-export-all" class="btn btn-mini" title="批量导出全部图片">全部导出</button>
              <button type="button" id="btn-export-settings" class="btn btn-mini" title="导出设置">导出设置</button>
            </div>
          </div>
          <div id="bottom-gallery" class="gallery-row"></div>
        </div>
      </section>
    </div>

    <div class="resize-handle" data-resize="right" role="separator" aria-orientation="vertical"
         aria-label="调整右侧栏宽度" tabindex="0"></div>

    <aside class="panel panel-right" aria-label="水印参数">
      <div id="controls" class="controls"></div>
      <div class="preset-bar">
        <button type="button" id="btn-preset-save" class="btn btn-mini">保存预设</button>
        <button type="button" id="btn-preset-use" class="btn btn-mini" aria-expanded="false" aria-haspopup="true">使用预设</button>
        <div id="preset-popover" class="preset-popover" hidden>
          <div class="preset-popover-title">已保存的预设</div>
          <div id="preset-popover-list" class="preset-popover-list"></div>
          <button type="button" id="btn-preset-import" class="preset-popover-import">导入预设</button>
        </div>
      </div>
    </aside>
  </main>

  <footer class="app-foot">
    <span>提示：预览与导出使用同一套布局引擎；导出 JPEG 默认回写 EXIF（Orientation 归 1、尺寸同步更新）。</span>
    <span>支持 Chrome / Edge 110+</span>
  </footer>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="drop-overlay" class="drop-overlay" hidden><div>松开以载入 JPG / PNG</div></div>

  <div id="progress" class="progress" hidden>
    <div class="progress-card">
      <div class="progress-head">
        <strong id="progress-title">处理中…</strong>
        <span id="progress-percent" class="muted small"></span>
      </div>
      <div class="progress-track"><div id="progress-fill" class="progress-fill"></div></div>
      <div class="progress-foot">
        <span id="progress-text" class="muted small"></span>
        <button type="button" id="btn-cancel" class="btn btn-mini">取消</button>
      </div>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-head">
        <h2 id="modal-title">标题</h2>
        <button type="button" id="modal-close" class="icon-btn" aria-label="关闭">×</button>
      </div>
      <div id="modal-body" class="modal-body"></div>
      <div id="modal-actions" class="modal-actions"></div>
    </div>
  </div>

  <!-- 导出设置控件常驻在此容器，打开弹窗时整体移入 #modal-body（节点复用，ctrlRefs 不失效） -->
  <div id="export-settings-host" hidden>
    <div id="export-modal-body" class="modal-export-body"></div>
  </div>

  <input type="file" id="file-input" accept="image/jpeg,image/png,.jpg,.jpeg,.png" multiple hidden>
  <input type="file" id="logo-input" accept="image/png,image/jpeg,image/webp,image/svg+xml,.png,.jpg,.jpeg,.webp,.svg" hidden>
  <input type="file" id="preset-input" accept="application/json,.json" hidden>

  <script src="js/tags.js"></script>
  <script src="js/exif.js"></script>
  <script src="js/meta.js"></script>
  <script src="js/brands.js"></script>
  <script src="js/state.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/render.js"></script>
  <script src="js/export.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
